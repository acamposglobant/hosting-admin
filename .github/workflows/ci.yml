name: CI

# Task 3 (plan Rev 3): portable tests run on every PR; the Linux runner executes
# Linux integration traits (procfs, statvfs, systemctl — from task 10 onward).
# The production VPS is never used as a CI environment (D13/T26).

# Least privilege: the CI only needs to read the repository.
permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test-linux:
    # Primary job: full test suite including Linux integration traits.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test (full suite, including Linux integration traits)
        run: dotnet test --no-build --logger "console;verbosity=normal"

  test-windows:
    # Portable tests must also pass on Windows; Linux-only integration traits
    # are excluded here (they execute on the Linux job above).
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test (portable tests only)
        run: dotnet test --no-build --filter "Category!=LinuxIntegration"

  test-frontend:
    # Frontend (task 14): Vite + React + TS. Type-check + build + component
    # tests (Vitest + React Testing Library) run on every PR.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Build (type-check + production bundle)
        run: npm run build

      - name: Test (Vitest + React Testing Library)
        run: npm test

  sudoers-validate:
    # Increment 2 task 7 (TA14): the sudoers policy artifact must be
    # syntactically valid. visudo -cf parses the file without installing it;
    # a malformed policy fails the PR. Runs on ubuntu-latest, which ships
    # sudo and visudo.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate sudoers artifact (visudo -cf)
        run: |
          visudo -cf deploy/sudoers/hostingadmin-agent

      - name: Validate generator output round-trip
        run: |
          chmod +x deploy/sudoers/generate.sh
          ./deploy/sudoers/generate.sh nginx.service ssh.service > /tmp/generated-sudoers
          visudo -cf /tmp/generated-sudoers
          # The generated policy must contain exactly 3 lines per unit.
          test "$(grep -c 'systemctl' /tmp/generated-sudoers)" -eq 6

  backup-restore-test:
    # Increment 3 task 4 (TA18): the operator-run backup/restore scripts must
    # round-trip a scratch database. Restore must prune sessions (no
    # resurrected sessions) while audit history survives, must verify the
    # sha256 manifest, and must reject a tampered backup. Runs on
    # ubuntu-latest, which ships sqlite3 and bash.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run backup/restore round-trip test
        run: |
          chmod +x deploy/backup.sh deploy/restore.sh deploy/test-backup-restore.sh
          ./deploy/test-backup-restore.sh

      - name: Shellcheck deploy scripts
        run: |
          shellcheck deploy/backup.sh deploy/restore.sh deploy/test-backup-restore.sh
